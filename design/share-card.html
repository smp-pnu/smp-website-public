<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMP 공식 공유 이미지 · 1200 × 630</title>
<link rel="stylesheet" href="/fonts/wght.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: 'Noto Sans KR Variable', sans-serif; background: #f6f6f3; }
  .scene { position: relative; width: 1200px; height: 630px; isolation: isolate; }
  .scene::before { content: ''; position: absolute; inset: 0 0 174px; background: #deded9; }
  .horizon { position: absolute; top: 456px; left: 0; right: 0; height: 1px; background: #d3d3cd; }
  .card { position: absolute; left: 88px; top: 52px; width: 1024px; height: 508px; border-radius: 14px;
    background: linear-gradient(123deg, #2c2e31, #191b1e 52%, #17191c); color: #fafaf7;
    border: 1px solid #44464a; box-shadow: 0 34px 36px -26px #1013167a, 0 9px 12px -7px #0c101650;
  }
  .card::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 1px #ffffff14, inset 0 -2px #00000080; }
  .eyebrow { position: absolute; top: 35px; left: 40px; margin: 0; color: #a8abb0; font-size: 14px; font-weight: 500; letter-spacing: 3px; }
  .logo { position: absolute; width: 416px; height: auto; top: 88px; left: 304px; }
  h1 { position: absolute; top: 302px; width: 100%; margin: 0; text-align: center;
    font-size: 34px; font-weight: 550; line-height: 1.5; letter-spacing: -1px; }
  .purpose { position: absolute; top: 366px; width: 100%; text-align: center; margin: 0;
    font-size: 17px; font-weight: 400; letter-spacing: 1px; color: #a8abb0; }
  .domain { position: absolute; left: 40px; bottom: 30px; margin: 0; font-size: 16px; letter-spacing: 1px; color: #b7b9bc; }
  .since { position: absolute; right: 40px; bottom: 30px; margin: 0; font-size: 13px; letter-spacing: 2px; color: #95999e; }
</style>
<main class="scene" aria-label="밝은 바닥 위에 떠 있는 SMP 공식 명함">
  <div class="horizon"></div>
  <section class="card">
    <p class="eyebrow">STOCK MASTERS OF PNU</p>
    <img class="logo" src="/logo.svg" alt="SMP">
    <h1>부산대학교 금융투자학회</h1>
    <p class="purpose">기업·산업 분석 · 가치투자 연구</p>
    <p class="domain">pnusmp.com</p><p class="since">EST. 2006</p>
  </section>
</main>
</html>
