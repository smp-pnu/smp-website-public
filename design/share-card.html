<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMP 공식 공유 이미지 · 2400 × 1260</title>
<link rel="stylesheet" href="/fonts/wght.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 2400px; height: 1260px; }
  body { font-family: 'Noto Sans KR Variable', sans-serif; background: #14232d; }
  .scene { position: relative; width: 1200px; height: 630px; isolation: isolate; overflow: hidden;
    transform: scale(2); transform-origin: top left; color: #fff; }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 58%; z-index: -3; }
  .shade { position: absolute; inset: 0; z-index: -2;
    background: linear-gradient(90deg,rgba(7,18,29,.7),rgba(7,18,29,.24) 57%,rgba(7,18,29,.06)),rgba(7,18,29,.28); }
  p, h1 { margin: 0; position: absolute; text-shadow: 0 2px 10px #00000024; }
  .eyebrow { left: 96px; top: 56.7px; font: 500 16.2px/1.4 Arial,sans-serif; letter-spacing: 3px; color: #d9e2e8; }
  .logo { position: absolute; width: 432px; height: auto; left: 90px; top: 119.7px; }
  h1 { left: 96px; top: 384.3px; font-size: 39.6px; font-weight: 600; line-height: 1.5; letter-spacing: -1.32px; }
  .purpose { left: 96px; top: 453.6px; font-size: 20.4px; font-weight: 400; line-height: 1.5; letter-spacing: .36px; color: #d5dfe7; }
  .domain { left: 96px; bottom: 50.4px; font: 400 18.6px/1.4 Arial,sans-serif; letter-spacing: 1.44px; color: #dee5ea; }
</style>
<main class="scene" aria-label="광안대교 풍경과 SMP 공식 로고">
  <img class="photo" src="/background.png" alt=""><div class="shade"></div>
  <p class="eyebrow">STOCK MASTERS OF PNU</p>
  <img class="logo" src="/logo-clean.svg" alt="SMP">
  <h1>부산대학교 금융투자학회</h1>
  <p class="purpose">기업·산업 분석 · 가치투자 연구</p>
  <p class="domain">pnusmp.com</p>
</main>
</html>
