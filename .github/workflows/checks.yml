name: Website checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 0 * * 1"
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.3.4 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm audit --audit-level=high
      - run: pnpm build
      - run: pnpm test:bundles
      - run: pnpm typecheck
      - run: pnpm test:free:render
      - name: Test the Cloudflare runtime with local fixture data
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node scripts/dev-free.mjs > /tmp/smp-fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3005/api/health > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$fixture_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat /tmp/smp-fixture.log; exit 1; fi
          node tests/free-http.mjs || { cat /tmp/smp-fixture.log; exit 1; }
