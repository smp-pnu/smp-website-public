name: Website checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 0 * * 1"
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.3.4 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm audit --audit-level=high
      - run: pnpm build
      - run: pnpm test:bundles
      - run: pnpm typecheck
      - run: pnpm seed:free:fixture && pnpm build:free:fixture
