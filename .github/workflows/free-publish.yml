name: Publish CMS on the free architecture
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'publish: 게시 / status: 상태 / retry-failed: 중단 건 재시도 / refresh-report: PDF·표지 새로 확인 / prepare-library: 기존 리포트 전체 변환'
        type: choice
        default: publish
        options: [publish, status, retry-failed, refresh-report, prepare-library]
      migrate_plain_cache:
        description: '보안 전환 시에만 기존 자료 캐시를 한 번 암호화합니다.'
        type: boolean
        default: false
      page_id:
        description: 'retry-failed / refresh-report에서만 Notion 페이지 ID 입력'
        type: string
        required: false
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: smp-free-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'smp-pnu/smp-website-public' && vars.SMP_FREE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.inputs.operation == 'prepare-library' && 180 || 15 }}
    environment: free-production
    env:
      WRANGLER_SEND_METRICS: 'false'
      SMP_FREE_DEPLOY_APPROVED: '1'
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SMP_FREE_DATABASE_ID: ${{ vars.SMP_FREE_DATABASE_ID }}
      SMP_FREE_ORIGIN: ${{ vars.SMP_FREE_ORIGIN }}
      SMP_FORCE_BUILD: ${{ github.event_name == 'push' && '1' || '0' }}
      NOTION_METADATA_WRITE_ENABLED: 'true'
      SMP_ALLOW_PDF_TOOL_INSTALL: '1'
      SMP_CMS_OPERATION: ${{ github.event.inputs.operation || 'publish' }}
      SMP_CMS_PAGE_ID: ${{ github.event.inputs.page_id || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.3.4 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
        if: github.event_name != 'schedule'
      - name: Collect private Cloudflare usage snapshot
        run: pnpm cloud:usage
        continue-on-error: true
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Collect private site analytics snapshot
        run: node --import tsx free/jobs/collect-site-analytics.ts
        continue-on-error: true
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Restore encrypted publication assets
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: private-assets
        with:
          path: .smp-private-cache/assets.enc
          key: smp-private-assets-v1-${{ github.run_id }}
          restore-keys: smp-private-assets-v1-
      - name: Decrypt trusted publication assets
        run: node scripts/private-asset-cache.mjs open
        env:
          SMP_ASSET_CACHE_KEY: ${{ secrets.SMP_ASSET_CACHE_KEY }}
      # Explicit, one-time transition only. Never save plaintext caches again.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: github.event_name == 'workflow_dispatch' && inputs.migrate_plain_cache && steps.private-assets.outputs.cache-matched-key == ''
        with:
          path: .smp-cache/covers
          key: smp-free-public-assets-migration
          restore-keys: smp-free-public-assets-
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: github.event_name == 'workflow_dispatch' && inputs.migrate_plain_cache && steps.private-assets.outputs.cache-matched-key == ''
        with:
          path: .smp-cache/reader-pdfs
          key: smp-free-reader-pdfs-migration
          restore-keys: smp-free-reader-pdfs-
      - run: pnpm cms:manage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: pnpm publish:free
        if: env.SMP_CMS_OPERATION != 'status'
        id: publisher
        env:
          SMP_MEDIA_SANDBOX: '1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_REPORTS_DATA_SOURCE_ID: ${{ secrets.NOTION_REPORTS_DATA_SOURCE_ID }}
          NOTION_NOTICES_DATA_SOURCE_ID: ${{ secrets.NOTION_NOTICES_DATA_SOURCE_ID }}
          NOTION_MEMBERS_DATA_SOURCE_ID: ${{ secrets.NOTION_MEMBERS_DATA_SOURCE_ID }}
      - name: Encrypt publication assets
        if: success() && (steps.publisher.outputs.assets_changed == 'true' || inputs.migrate_plain_cache)
        run: node scripts/private-asset-cache.mjs seal
        env:
          SMP_ASSET_CACHE_KEY: ${{ secrets.SMP_ASSET_CACHE_KEY }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: success() && (steps.publisher.outputs.assets_changed == 'true' || inputs.migrate_plain_cache)
        with:
          path: .smp-private-cache/assets.enc
          key: smp-private-assets-v1-${{ github.run_id }}
