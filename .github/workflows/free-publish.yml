name: Publish CMS on the free architecture
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: smp-free-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'smp-pnu/smp-website-public' && vars.SMP_FREE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: free-production
    env:
      WRANGLER_SEND_METRICS: 'false'
      SMP_FREE_DEPLOY_APPROVED: '1'
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SMP_FREE_DATABASE_ID: ${{ vars.SMP_FREE_DATABASE_ID }}
      SMP_FREE_ORIGIN: ${{ vars.SMP_FREE_ORIGIN }}
      SMP_FORCE_BUILD: ${{ github.event_name == 'push' && '1' || '0' }}
      NOTION_METADATA_WRITE_ENABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.3.4 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: assets
        with:
          path: .smp-cache/covers
          key: smp-free-public-assets-${{ github.run_id }}
          restore-keys: smp-free-public-assets-
      - run: pnpm publish:free
        id: publisher
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_REPORTS_DATA_SOURCE_ID: ${{ secrets.NOTION_REPORTS_DATA_SOURCE_ID }}
          NOTION_NOTICES_DATA_SOURCE_ID: ${{ secrets.NOTION_NOTICES_DATA_SOURCE_ID }}
          NOTION_MEMBERS_DATA_SOURCE_ID: ${{ secrets.NOTION_MEMBERS_DATA_SOURCE_ID }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: success() && steps.publisher.outputs.assets_changed == 'true'
        with:
          path: .smp-cache/covers
          key: smp-free-public-assets-${{ github.run_id }}
