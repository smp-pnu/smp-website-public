name: Publish CMS on the free architecture
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'publish: 게시 / status: 상태 / retry-failed: 중단 건 재시도 / refresh-report: PDF·표지 새로 확인 / prepare-library: 기존 리포트 전체 변환'
        type: choice
        default: publish
        options: [publish, status, retry-failed, refresh-report, prepare-library]
      page_id:
        description: 'retry-failed / refresh-report에서만 Notion 페이지 ID 입력'
        type: string
        required: false
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: smp-free-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'smp-pnu/smp-website-public' && vars.SMP_FREE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.inputs.operation == 'prepare-library' && 180 || 15 }}
    environment: free-production
    env:
      WRANGLER_SEND_METRICS: 'false'
      SMP_FREE_DEPLOY_APPROVED: '1'
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SMP_FREE_DATABASE_ID: ${{ vars.SMP_FREE_DATABASE_ID }}
      SMP_FREE_ORIGIN: ${{ vars.SMP_FREE_ORIGIN }}
      SMP_FORCE_BUILD: ${{ github.event_name == 'push' && '1' || '0' }}
      NOTION_METADATA_WRITE_ENABLED: 'true'
      SMP_ALLOW_PDF_TOOL_INSTALL: '1'
      SMP_CMS_OPERATION: ${{ github.event.inputs.operation || 'publish' }}
      SMP_CMS_PAGE_ID: ${{ github.event.inputs.page_id || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.3.4 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test
        if: github.event_name != 'schedule'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: assets
        with:
          path: .smp-cache/covers
          key: smp-free-public-assets-${{ github.run_id }}
          restore-keys: smp-free-public-assets-
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .smp-cache/reader-pdfs
          key: smp-free-reader-pdfs-${{ github.run_id }}
          restore-keys: smp-free-reader-pdfs-
      - run: pnpm cms:manage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: pnpm publish:free
        if: env.SMP_CMS_OPERATION != 'status'
        id: publisher
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_REPORTS_DATA_SOURCE_ID: ${{ secrets.NOTION_REPORTS_DATA_SOURCE_ID }}
          NOTION_NOTICES_DATA_SOURCE_ID: ${{ secrets.NOTION_NOTICES_DATA_SOURCE_ID }}
          NOTION_MEMBERS_DATA_SOURCE_ID: ${{ secrets.NOTION_MEMBERS_DATA_SOURCE_ID }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && steps.publisher.outputs.assets_changed == 'true'
        with:
          path: .smp-cache/covers
          key: smp-free-public-assets-${{ github.run_id }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: success() && steps.publisher.outputs.assets_changed == 'true'
        with:
          path: .smp-cache/reader-pdfs
          key: smp-free-reader-pdfs-${{ github.run_id }}
